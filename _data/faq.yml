# Veelgestelde vragen
- vraag: Hoe kan ik lid worden bij Joy-M?
  antwoord: |
    Stuur eerst een mail of kom langs bij een training en vraag om een proeftraining. Weet je zeker dat je lid wilt worden? Meld je dan aan bij onze club via het [aanmeldformulier](/lid-worden/). Wanneer de aanmelding is verwerkt, ben je lid.
- vraag: Bij wie kan ik terecht voor vragen over basketbal?
  antwoord: |
    Je kunt altijd een mailtje met je vraag sturen naar ons mailadres: [joymbasketbal@gmail.com](mailto:joymbasketbal@gmail.com). Ook alle coaches en bestuursleden kunnen je hiermee helpen.
- vraag: Ik wil ook competitie spelen, hoe gaat dat?
  antwoord: |
    Je traint natuurlijk om wedstrijden te spelen (en te winnen). In principe speel je altijd competitie wanneer er aan het begin van het seizoen een compleet team is dat ingeschreven kan worden!
- vraag: Ik wil graag een keer meetrainen, kan dat?
  antwoord: |
    Jazeker! Stuur een berichtje naar [joymbasketbal@gmail.com](mailto:joymbasketbal@gmail.com). Wij laten de trainer weten dat je komt en spreken met je af waar en hoe laat de training begint.
- vraag: Moet ik ook fluiten of tafelen?
  antwoord: |
    Wanneer je competitie speelt, wordt er ook verwacht dat je af en toe een wedstrijd fluit of tafelt. Je krijgt hiervoor natuurlijk eerst de juiste instructies en oefening.
