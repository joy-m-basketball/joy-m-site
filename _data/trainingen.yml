# Trainingstijden per dag. Gebruik bij "teams" precies de namen uit Teams (_data/teams.yml).
- dag: Dinsdag
  trainingen:
    - tijd: "20:15 – 22:00"
      teams: [Heren senioren, Dames recreanten, Recreanten gemengd]
- dag: Woensdag
  trainingen:
    - tijd: "17:30 – 19:00"
      teams: [U12, U16]
    - tijd: "19:00 – 20:30"
      teams: [U18]
- dag: Vrijdag
  trainingen:
    - tijd: "9:45 – 10:45"
      teams: [Walking basketbal]
    - tijd: "18:00 – 19:30"
      teams: [U16, U18]
